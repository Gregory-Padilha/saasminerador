<svg width="140" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Drop Shadow -->
  <rect x="5" y="10" width="130" height="66" rx="10" fill="#000" opacity="0.4" filter="url(#shadow)"/>
  <!-- Mahogany Wood Frame -->
  <rect x="6" y="6" width="128" height="64" rx="8" fill="#3f1d0b" stroke="#78350f" stroke-width="3"/>
  <!-- Metallic Corner Accents -->
  <rect x="8" y="8" width="8" height="8" fill="#d97706" rx="2"/>
  <rect x="124" y="8" width="8" height="8" fill="#d97706" rx="2"/>
  <rect x="8" y="60" width="8" height="8" fill="#d97706" rx="2"/>
  <rect x="124" y="60" width="8" height="8" fill="#d97706" rx="2"/>
  <!-- Emerald Green Felt Surface -->
  <rect x="14" y="14" width="112" height="48" rx="4" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
  <!-- 6 Pockets -->
  <circle cx="18" cy="18" r="4" fill="#090d14" stroke="#334155" stroke-width="1"/>
  <circle cx="70" cy="17" r="3.5" fill="#090d14" stroke="#334155" stroke-width="1"/>
  <circle cx="122" cy="18" r="4" fill="#090d14" stroke="#334155" stroke-width="1"/>
  <circle cx="18" cy="58" r="4" fill="#090d14" stroke="#334155" stroke-width="1"/>
  <circle cx="70" cy="59" r="3.5" fill="#090d14" stroke="#334155" stroke-width="1"/>
  <circle cx="122" cy="58" r="4" fill="#090d14" stroke="#334155" stroke-width="1"/>
  <!-- Billiards Balls -->
  <circle cx="45" cy="38" r="3" fill="#ffffff"/> <!-- Cue Ball -->
  <circle cx="90" cy="38" r="3" fill="#ef4444"/> <!-- Red Ball -->
  <circle cx="96" cy="34" r="3" fill="#f59e0b"/> <!-- Yellow Ball -->
  <circle cx="96" cy="42" r="3" fill="#3b82f6"/> <!-- Blue Ball -->
  <circle cx="102" cy="38" r="3" fill="#8b5cf6"/> <!-- Purple Ball -->
  <circle cx="102" cy="30" r="3" fill="#ec4899"/> <!-- Pink Ball -->
  <!-- Cue Sticks Resting Beside Table -->
  <line x1="20" y1="74" x2="120" y2="74" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="74" x2="35" y2="74" stroke="#f8fafc" stroke-width="2"/>
</svg>